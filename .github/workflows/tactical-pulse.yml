name: Tactical Pulse Dry-Run

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  tactical_pulse:
    runs-on: ubuntu-latest
    concurrency:
      group: tactical-pulse
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run setup_agent_config (create agent_config sheet)
        env:
          PORTFOLIO_GS_CREDS: ${{ secrets.PORTFOLIO_GS_CREDS }}
        run: |
          python -m src.scripts.setup_agent_config

      - name: Run tactical pulse dry-run
        env:
          PORTFOLIO_GS_CREDS: ${{ secrets.PORTFOLIO_GS_CREDS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IOL_USERNAME: ${{ secrets.IOL_USERNAME }}
          IOL_PASSWORD: ${{ secrets.IOL_PASSWORD }}
        run: |
          python -m src.jobs.tactical_pulse_job
